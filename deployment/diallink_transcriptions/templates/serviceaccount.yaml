{{- if not (lookup "v1" "ServiceAccount" .Release.Namespace "secrets-access-sa") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "diallink_transcriptions_lite.serviceAccountName" . }}
  labels:
    {{- include "diallink_transcriptions_lite.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
