{{- if .Values.ingress.enabled }}
  {{- range $name, $ing := .Values.ingress.ingresses }}
  {{- if $ing.enabled }}

  {{- $fullName := include "diallink_transcriptions_lite.fullname" $ }}
  {{- $svcPort := $.Values.service.port }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-{{ $name }}
  labels:
    {{- include "diallink_transcriptions_lite.labels" $ | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className }}
  {{- end }}

  {{- if $ing.tls }}
  tls:
    {{- range $ing.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}

  rules:
    {{- range $ing.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}

---
{{- end }}
  {{- end }}
  {{- end }}
